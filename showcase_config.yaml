# CCMD Showcase Configuration
# This file defines what features to display in showcase.py
# Update this file when releasing new versions

version: "1.1.5"
release_date: "October 30, 2025"
subtitle: "Advanced Security Release — Comprehensive Threat Model & Protection"

# Main feature sections
sections:
  - title: "Advanced Security Enhancements"
    emoji: "🔒"
    type: "security"
    items:
      - number: 1
        title: "Internal Flag Protection"
        description: "--exec flag hidden from help, environment-gated (CCMD_INTERNAL=1) for internal use only"

      - number: 2
        title: "Atomic Shell Config Writes"
        description: "Prevents corruption with temp file + atomic rename pattern, auto-recovery on failure"

      - number: 3
        title: "Path Diagnostics Command"
        description: "--check-paths validates CCMD_HOME, installation directory, files, and backups"

      - number: 4
        title: "Threat Model Documentation"
        description: "Complete attack scenarios, mitigations, and security boundaries in THREAT_MODEL.md"

      - number: 5
        title: "Recovery Guide"
        description: "Emergency procedures for all failure scenarios in RECOVERY.md"

      - number: 6
        title: "Automated Dependency Scanning"
        description: "Dependabot weekly scans + Safety scanner integrated in CI workflow"

      - number: 7
        title: "Enhanced Shell Safety"
        description: "Shell syntax validation, atomic writes with backup, auto-rollback"

  - title: "Security Infrastructure"
    emoji: "🛡️"
    features:
      - icon: "🩺"
        title: "Path Diagnostics"
        description: "New --check-paths command validates entire installation"
        example: "Checks CCMD_HOME, run.py, commands.yaml, shell config, backups"

      - icon: "⚛️"
        title: "Atomic Writes"
        description: "Shell config modifications use atomic rename pattern"
        example: "Write to temp → validate → atomic rename → auto-recovery"

      - icon: "🔐"
        title: "Environment Gating"
        description: "Internal flags protected by environment variables"
        example: "CCMD_INTERNAL=1 required for internal command execution"

      - icon: "📦"
        title: "Dependabot Integration"
        description: "Weekly automated dependency vulnerability scanning"
        example: "Python packages and GitHub Actions monitored"

      - icon: "🔍"
        title: "Safety Scanner"
        description: "Dependency vulnerability checking in CI pipeline"
        example: "Checks requirements.txt for known CVEs"

  - title: "New Documentation"
    emoji: "📖"
    features:
      - icon: "🛡️"
        title: "THREAT_MODEL.md"
        description: "Comprehensive threat analysis and security boundaries"
        example: "Attack scenarios, mitigations, incident response"

      - icon: "🚑"
        title: "RECOVERY.md"
        description: "Emergency recovery procedures for all platforms"
        example: "Linux, Mac, Windows, WSL recovery guides"

      - icon: "🧪"
        title: "TESTING.md"
        description: "Complete testing guide with 18 automated tests"
        example: "Security tests, unit tests, manual test checklists"

      - icon: "📝"
        title: "Updated SECURITY_CHANGELOG.md"
        description: "Full v1.1.5 security improvements documented"
        example: "All 7 audit items addressed with code references"

  - title: "Security Metrics"
    emoji: "📊"
    type: "improvements"
    items:
      - title: "0 HIGH Severity Issues"
        description: "Maintained clean security posture from v1.1.4"

      - title: "All 7 Audit Items Addressed"
        description: "Community security review recommendations fully implemented"

      - title: "18 Automated Tests Passing"
        description: "Comprehensive test suite validates all security features"

      - title: "Bandit Scan: PASSING"
        description: "0 HIGH, 5 MEDIUM (documented), 46 LOW (normal)"

      - title: "Safety Check: PASSING"
        description: "0 known vulnerabilities in dependencies"

