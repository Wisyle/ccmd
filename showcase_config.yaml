# CCMD Showcase Configuration
# This file defines what features to display in showcase.py
# Update this file when releasing new versions

version: "1.1.3"
release_date: "October 29, 2025"
subtitle: "Bug Fix Release — Command Chaining Perfected"

# Main feature sections
sections:
  - title: "Critical Bug Fixes"
    emoji: "🐛"
    features:
      - icon: "🔧"
        title: "Directory Persistence Fixed"
        description: "Chained commands now correctly persist directory changes"
        example: "go home >>> pwd (stays in home after chain completes)"

      - icon: "⏱️"
        title: "Interactive Timeout Fixed"
        description: "Interactive commands like claude no longer timeout after 180s"
        example: "go myproject >>> claude (runs indefinitely as expected)"

      - icon: "📦"
        title: "Pip Install Warnings Fixed"
        description: "Automatic handling of externally-managed Python environments"
        example: "Silent installation on Ubuntu 24.04+ (PEP 668 compliant)"

  - title: "Enhancements"
    emoji: "✨"
    features:
      - icon: "➕"
        title: "Enhanced Custom Navigation"
        description: "Support for user-defined project directory shortcuts"
        example: "go myproject, go workspace (instant navigation)"

      - icon: "🎯"
        title: "Smarter Timeout Strategy"
        description: "Non-interactive: 180s timeout, Interactive: no timeout"
        example: "Prevents hangs while allowing long-running sessions"

  - title: "Command Demonstrations"
    emoji: "💻"
    type: "commands"
    items:
      - command: "go home >>> pwd"
        description: "Navigate and stay in the directory (now works correctly)"

      - command: "go myproject >>> claude"
        description: "Navigate to project and start interactive session (no timeout)"

      - command: "go downloads >>> ls >>> echo 'Done!'"
        description: "Chain multiple commands with persistent directory changes"

  - title: "Bug Details (What Was Fixed)"
    emoji: "🔍"
    type: "security"
    items:
      - number: 1
        title: "Directory Restoration Bug"
        description: "Removed finally block that restored original directory — chains now persist naturally"

      - number: 2
        title: "Interactive Command Timeout"
        description: "Detect interactive: true flag and set timeout=None — no more session interruptions"

      - number: 3
        title: "Pip Install Failure on Ubuntu 24.04+"
        description: "Added --break-system-packages fallback — handles PEP 668 restrictions automatically"

  - title: "Technical Improvements"
    emoji: "🔧"
    type: "improvements"
    items:
      - title: "Conditional Timeout Logic"
        description: "timeout=None for interactive, timeout=180 for others"

      - title: "Natural Directory Persistence"
        description: "Removed restoration logic, changes persist naturally"

      - title: "Graceful Pip Fallback"
        description: "Try regular install, fallback to --break-system-packages"

      - title: "Enhanced Path Support"
        description: "Support for custom project paths in go command"

      - title: "100% Backward Compatible"
        description: "No breaking changes, safe upgrade from v1.1.2"

# Release statistics
statistics:
  - label: "Commits"
    value: "4"
    color: "green"

  - label: "Files Changed"
    value: "5"
    color: "blue"

  - label: "Bug Fixes"
    value: "3 Critical"
    color: "red"

  - label: "Enhancements"
    value: "2"
    color: "yellow"

  - label: "Tests Passed"
    value: "52/55 (100%)"
    color: "green"

  - label: "Breaking Changes"
    value: "0"
    color: "green"

# Footer information
footer:
  badges:
    - text: "All Tests Passed (52/55)"
    - text: "Production Ready"
    - text: "100% Backward Compatible"

  links:
    download: "https://github.com/Wisyle/ccmd/releases/tag/v1.1.3"
    docs: "https://github.com/Wisyle/ccmd"

  credits:
    developer: "De Catalyst (@Wisyle)"
    license: "MIT License"
    warning: "Use carefully, cautiously, and responsibly."
