# CCMD Showcase Configuration
# This file defines what features to display in showcase.py
# Update this file when releasing new versions

version: "1.1.4"
release_date: "October 30, 2025"
subtitle: "Security Hardening Release — 0 HIGH Vulnerabilities"

# Main feature sections
sections:
  - title: "Critical Security Fixes"
    emoji: "🔒"
    type: "security"
    items:
      - number: 1
        title: "Tarfile Path Traversal (CVE-2007-4559)"
        description: "Added validation to prevent malicious archives from writing outside target directory"

      - number: 2
        title: "URL Scheme Validation"
        description: "Restricted all URL operations to HTTPS only — prevents HTTP downgrade attacks"

      - number: 3
        title: "Dependency Vulnerabilities"
        description: "Pinned GitPython to v3.1.43 — eliminates 6 known vulnerabilities"

  - title: "Security Infrastructure"
    emoji: "🛡️"
    features:
      - icon: "🤖"
        title: "Automated Security Scanning"
        description: "Bandit and Safety integrated for continuous security monitoring"
        example: "GitHub Actions run security checks on every commit"

      - icon: "📊"
        title: "CodeQL Analysis"
        description: "GitHub's semantic code analysis detects vulnerabilities automatically"
        example: "Catches security issues before they reach production"

      - icon: "📋"
        title: "Security Policy"
        description: "Professional vulnerability reporting process established"
        example: "48-hour response time, responsible disclosure guidelines"

      - icon: "📝"
        title: "Security Changelog"
        description: "All security improvements tracked and documented"
        example: "Complete audit trail of every security enhancement"

  - title: "Security Metrics"
    emoji: "📊"
    type: "improvements"
    items:
      - title: "0 HIGH Severity Issues"
        description: "Down from 2 — all critical vulnerabilities eliminated"

      - title: "5 MEDIUM Issues Mitigated"
        description: "Documented and addressed with defense-in-depth approach"

      - title: "0 Vulnerable Dependencies"
        description: "All dependencies pinned to secure versions"

      - title: "Bandit Scan: PASSING"
        description: "Python security linting shows no critical issues"

      - title: "Safety Check: PASSING"
        description: "Dependency vulnerability scanner reports 0 issues"

  - title: "New Security Files"
    emoji: "📁"
    features:
      - icon: "🔐"
        title: "SECURITY.md"
        description: "Vulnerability reporting policy and security measures"
        example: "Robert5560newton@gmail.com — 48hr response time"

      - icon: "📜"
        title: "SECURITY_CHANGELOG.md"
        description: "Complete history of all security improvements"
        example: "Track every security fix across all versions"

      - icon: "⚙️"
        title: "GitHub Actions Workflows"
        description: "Automated security scanning on every commit"
        example: "codeql-analysis.yml, security_lint.yml"

      - icon: "📄"
        title: "Security Audit Reports"
        description: "Detailed reports in security/ directory"
        example: "Full Phase 1 audit results and remediation steps"

# Release statistics
statistics:
  - label: "HIGH Issues Fixed"
    value: "2 → 0"
    color: "green"

  - label: "Files Changed"
    value: "16"
    color: "blue"

  - label: "Security Fixes"
    value: "3 Critical"
    color: "red"

  - label: "New Security Files"
    value: "12"
    color: "yellow"

  - label: "Bandit Scan"
    value: "PASSING"
    color: "green"

  - label: "Safety Check"
    value: "0 Vulnerabilities"
    color: "green"

  - label: "Breaking Changes"
    value: "0"
    color: "green"

