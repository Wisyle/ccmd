# CCMD Showcase Configuration
# This file defines what features to display in showcase.py
# Update this file when releasing new versions

version: "1.1.7"
release_date: "December 5, 2025"
subtitle: "Bug Fix Release — Directory Search in Command Chains"

# Main feature sections
sections:
  - title: "Critical Bug Fix"
    emoji: "🔧"
    type: "security"
    items:
      - number: 1
        title: "Directory Search in Chains"
        description: "go <dirname> now correctly searches for directories when used in command chains"

  - title: "What Was Fixed"
    emoji: "🎯"
    features:
      - icon: "❌"
        title: "Before (Bug)"
        description: "go <dirname> in chain defaulted to ~/Downloads"
        example: "mycommand → go projects >>> ls → went to Downloads!"

      - icon: "✅"
        title: "After (Fixed)"
        description: "go <dirname> in chain now searches and finds correct directory"
        example: "mycommand → go projects >>> ls → searches → finds /home/user/projects"

  - title: "Technical Changes"
    emoji: "🔬"
    features:
      - icon: "🔍"
        title: "_search_directory() Method"
        description: "New helper method added to CommandExecutor class"
        example: "Searches common locations up to 3 levels deep"

      - icon: "📝"
        title: "search_dir Parameter Handling"
        description: "Added check in _execute_ccmd_command() for unknown directories"
        example: "Now mirrors main.py's directory search behavior"

  - title: "Previous Fixes (v1.1.6)"
    emoji: "📦"
    type: "improvements"
    items:
      - title: "Argument Passing Fix"
        description: "Commands with placeholders pass ALL arguments, not just first"

      - title: "Command Chaining Security"
        description: "Password-protected commands in chains require authentication"

# Release statistics
statistics:
  - label: "Bugs Fixed"
    value: "1"
    color: "green"

  - label: "Methods Added"
    value: "1"
    color: "blue"

  - label: "Lines Changed"
    value: "~70"
    color: "yellow"

  - label: "Breaking Changes"
    value: "0"
    color: "green"

# Footer information
footer:
  badges:
    - text: "Bug Fix Release"
    - text: "Chain Commands Working"
    - text: "100% Backward Compatible"

  links:
    download: "https://github.com/Wisyle/ccmd/releases/tag/v1.1.7"
    docs: "https://github.com/Wisyle/ccmd"
    security: "https://github.com/Wisyle/ccmd/security"

  credits:
    developer: "De Catalyst (@Wisyle)"
    license: "MIT License"
    warning: "Security-first CLI tool. Report vulnerabilities to Robert5560newton@gmail.com"
