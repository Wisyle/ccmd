[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccmd"
version = "2.0.7"
description = "ccmd — Agentic Project Hub. Pick a project, pick an agent, launch."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "De Catalyst", email = "Robert5560newton@gmail.com"}
]
keywords = [
    "cli", "tui", "terminal", "agent", "mcp", "project-hub",
    "claude", "codex", "grok", "developer-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
    "textual>=0.80.0",
    "rich>=13.0.0",
    "rapidfuzz>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "bandit>=1.7",
    "ruff>=0.4",
]
mcp = [
    "mcp>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/Wisyle/ccmd"
Repository = "https://github.com/Wisyle/ccmd"
Documentation = "https://github.com/Wisyle/ccmd#readme"

[project.scripts]
ccmd = "ccmd.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ccmd*"]
exclude = ["tests*", "legacy_v1*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "legacy_v1"]
